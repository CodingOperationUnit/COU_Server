spring.application.name=cou-server
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/cou
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=86400
spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
dev-tools.enabled=${DEV_TOOLS_ENABLED:false}
spring.config.import=optional:file:.env[.properties]

# 프록시(ALB, Nginx, 터널) 뒤에서도 실제 사용자 IP를 얻는다. 내부망 주소에서 온 요청의 X-Forwarded-For만 믿는다
server.forward-headers-strategy=native

# 로그인·회원가입 시도 제한
auth.rate-limit.login-max-failures=${AUTH_LOGIN_MAX_FAILURES:5}
auth.rate-limit.login-lock-seconds=${AUTH_LOGIN_LOCK_SECONDS:900}
auth.rate-limit.ip-max-requests=${AUTH_IP_MAX_REQUESTS:30}
auth.rate-limit.ip-window-seconds=${AUTH_IP_WINDOW_SECONDS:60}

# 전투 시간 검증의 배속 한도. 정식 클라이언트는 배속이 없어 1.0 (배속 기능을 넣으면 최대 배율로)
battle.max-speed-multiplier=${BATTLE_MAX_SPEED_MULTIPLIER:1.0}